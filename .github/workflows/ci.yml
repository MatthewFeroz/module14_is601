name: Module 14 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: module-14-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_IMAGE: matthewferoz/module14_is601

jobs:
  test:
    name: Unit, integration, and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: module14_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d module14_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/module14_test
      JWT_SECRET_KEY: module-14-ci-secret-replaced-outside-testing
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python and Chromium dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run frontend validation tests
        run: bun test static/js/script.test.js

      - name: Run unit, integration, API, and browser tests
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/junit.xml

      - name: Upload test reports and browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: module14-test-evidence
          path: |
            test-results/
            coverage.xml
          if-no-files-found: warn

  security:
    name: Container security scan
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag "${DOCKER_IMAGE}:test" .

      - name: Scan fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "${{ env.DOCKER_IMAGE }}:test"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Publish Docker image
    needs: security
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
