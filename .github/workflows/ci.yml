name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: module-13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: API and Playwright tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: module13_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d module13_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/module13_test
      JWT_SECRET_KEY: ci-only-jwt-secret-replaced-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt
          playwright install --with-deps chromium

      - name: Run unit, integration, and Playwright tests
        run: |
          mkdir -p test-results
          pytest --junitxml=test-results/junit.xml

      - name: Upload test reports and browser screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: module13-test-evidence
          path: |
            test-results/
            docs/images/
            coverage.xml
          if-no-files-found: error

  docker:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build verified image and publish main-branch tags
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            matthewferoz/module13-jwt-auth:latest
            matthewferoz/module13-jwt-auth:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
